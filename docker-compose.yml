version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: baglanulyabat-postgres
    environment:
      POSTGRES_DB: task_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
    ports:
      - "5432:5432"
    volumes:
      - baglanulyabat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baglanulyabat-network

  redis:
    image: redis:7-alpine
    container_name: baglanulyabat-redis
    ports:
      - "6379:6379"
    volumes:
      - baglanulyabat_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baglanulyabat-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baglanulyabat-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task_management_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456789
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_SECRET: BaglanulyAbatSuperSecretKey2024BaglanulyAbatSuperSecretKey2024
      APP_JWT_EXPIRATION_MS: 86400000
      APP_UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - baglanulyabat_uploads:/app/uploads
    networks:
      - baglanulyabat-network
    restart: on-failure
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  baglanulyabat_postgres_data:
  baglanulyabat_redis_data:
  baglanulyabat_uploads:

networks:
  baglanulyabat-network:
    driver: bridge