spring.application.name=BaglnaulyAbatFinalProject

server.port=8080

spring.datasource.url=jdbc:postgresql://postgres:5432/task_management_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.example.baglanulyabatfinalproject=DEBUG
logging.level.org.hibernate.SQL=DEBUG

app.jwt.refresh-expiration-ms=604800000

app.jwt.secret=BaglanulyAbatSuperSecretKey2024BaglanulyAbatSuperSecretKey2024
app.jwt.expiration-ms=86400000

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.async.core-pool-size=5
app.async.max-pool-size=10
app.async.queue-capacity=25